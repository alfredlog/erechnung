[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erechnung"
version = "0.1.0"
description = "E-Rechnung (XRechnung/ZUGFeRD) lesen, prüfen und exportieren für KMU"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "lxml>=5.2",
  "factur-x>=3.1",
  "httpx>=0.27",
  "reportlab>=4.2",
  "pillow>=10",
  "pypdf>=4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "cryptography>=42",
  "aiosmtpd>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pikepdf>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "static/*"]
"app.domain.render" = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query", "fastapi.File"]
