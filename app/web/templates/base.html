<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <script src="/static/htmx.min.js" defer></script>
  <style>
    :root { --ink:#1d2433; --muted:#5b6475; --line:#d9dde5; --bg:#f6f7f9; --card:#fff;
            --ok:#1f7a4d; --ok-bg:#e6f4ec; --warn:#8a5a00; --warn-bg:#fdf3dc; --err:#a12b2b; --err-bg:#fbe9e9;
            --accent:#1f4fd1; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
    main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 28px; margin: 0 0 4px; } h2 { font-size: 18px; margin: 28px 0 8px; }
    .lead { color: var(--muted); margin: 0 0 24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
    .drop { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font:inherit; cursor:pointer; }
    .badge { display:inline-block; padding:4px 10px; border-radius:999px; font-size:14px; font-weight:600; }
    .ok { background:var(--ok-bg); color:var(--ok); } .warning { background:var(--warn-bg); color:var(--warn); }
    .error { background:var(--err-bg); color:var(--err); }
    table { width:100%; border-collapse:collapse; font-size:15px; }
    th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    ul.findings { padding-left: 0; list-style: none; } ul.findings li { margin: 6px 0; }
    .htmx-indicator { display:none; } .htmx-request .htmx-indicator { display:inline; }
  </style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
