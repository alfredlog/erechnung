# Production-like stack. On the VPS, Nginx (already running for PDF Libre)
# proxies the dedicated domain to 127.0.0.1:8100.
services:
  api:
    build: .
    env_file: .env
    environment:
      KOSIT_URL: http://kosit:8080/
    ports: ["127.0.0.1:8100:8000"]
    depends_on: [kosit, db]
    mem_limit: 512m
    restart: unless-stopped

  kosit:
    build: docker/kosit
    mem_limit: 1g
    restart: unless-stopped
    # not published: only reachable from inside the Docker network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erechnung
      POSTGRES_USER: erechnung
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 512m
    restart: unless-stopped

volumes:
  pgdata:
