# Production stack on the VPS. Caddy (on the host) forwards the product domain to
# 127.0.0.1:8100. Port 25 receives the customers' invoice mails (receive only).
x-app: &app
  build: .
  env_file: .env
  environment:
    KOSIT_URL: http://kosit:8080/
    DATA_DIR: /data
  volumes: [files:/data]          # original invoices (archive), survives container updates
  depends_on:
    db: {condition: service_healthy}
    kosit: {condition: service_started}
  restart: unless-stopped

services:
  api:                            # website + API
    <<: *app
    ports: ["127.0.0.1:8100:8000"]
    mem_limit: 512m

  worker:                         # background: reads invoices (OCR/LLM), checks mailboxes
    <<: *app
    command: ["python", "-m", "app.worker"]
    mem_limit: 768m

  mailin:                         # receives mails for *@INBOUND_DOMAIN, never sends
    <<: *app
    command: ["python", "-m", "app.mailin"]
    ports: ["25:2525"]
    mem_limit: 256m

  kosit:                          # official XRechnung validator (Java)
    build: docker/kosit
    mem_limit: 1g
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erechnung
      POSTGRES_USER: erechnung
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erechnung -d erechnung"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

volumes:
  pgdata:
  files:
